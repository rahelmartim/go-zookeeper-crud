name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      zookeeper:
        image: zookeeper:3.9
        ports:
          - 2181:2181
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: Test, including the tests against ZooKeeper
        run: go test -race ./...
        env:
          ZOOKEEPER_SERVERS: localhost:2181
      - run: make web
